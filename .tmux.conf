set -g history-limit 50000

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi K send -X previous-prompt
bind -T copy-mode-vi J send -X next-prompt

set -s set-clipboard on
set -g allow-passthrough on
if 'command -v xclip'   "set -s copy-command 'xclip -in -selection clipboard'"
if 'command -v wl-copy' "set -s copy-command wl-copy"
if 'command -v pbcopy'  "set -s copy-command pbcopy"
bind -T copy-mode-vi y send -X copy-pipe
